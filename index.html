<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Designs/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="top">
        <div class="left">
            <div class="logo"></div>
            <h1 class="title">4LIBRARY</h1>
        </div>
        <div class="right">
            <input type="search" name="search" placeholder="Search" id="search-bar">
            <button class="nav-button">
                <i class="fa-solid fa-book" style="color: rgb(0, 0, 0);"></i>
            </button>
            <button class="nav-button">
                <i class="fa-solid fa-inbox" style="color: rgb(0, 0, 0);"></i>
            </button>
            <button class="nav-button">
                <i class="fa-solid fa-bars" style="color: rgb(0, 0, 0);"></i>
            </button>
        </div>
    </div>

    <main class="container">
        <div class="branch-lists">
            <div class="box-title">
                <h3 class="box-title-text">Branch</h3>
            </div>
            <div class="branch">
                <div class="banch-left">
                    <img height="50px" width="50px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJsxw1C9BpI6tOTmzT4J4Y4pucJM_7CosD-w&s" alt="" class="branch-image">
                </div>
                <div class="branch-right">
                    <h2 class="branch-name">Eclaro Academy</h2>
                    <p class="branch-address">3rd Floor, Ever Gotesco Mall, Commonwealth Ave., Quezon City.</p>
                </div>
            </div>
        </div>
        <div class="book-lists">
            <div class="box-title">
                <h3 class="box-title-text">Books</h3>
            </div>
            <div class="book">
                <div class="book-left">
                    <h2 class="book-name">Alamat ng Gubat <br>
                    <p class="book-author">Author: <span class="author">Bob Ong</span></p>
                    </h2>
                </div>
                <div class="book-right">
                    <p class="book-status" id="book">May 23</p>
                </div>
            </div>
        </div>
        <div class="dashboard">
            <div class="box-title">
                <h3 class="box-title-text">Detail</h3>
            </div>
        </div>
    </main>
</body>
</html>
